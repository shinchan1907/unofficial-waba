<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; color: #333; }
      .form-group { margin-bottom: 15px; }
      label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; }
      input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
      button { background-color: #10b981; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 10px; transition: 0.2s; }
      button:hover { background-color: #059669; }
      .btn-secondary { background-color: #3b82f6; }
      .btn-secondary:hover { background-color: #2563eb; }
      .header { margin-bottom: 20px; text-align: center; }
      .status { font-size: 12px; text-align: center; color: #059669; margin-top: 10px; min-height: 15px; font-weight: bold; }
      hr { border: 0; border-top: 1px solid #eee; margin: 20px 0; }
    </style>
  </head>
  <body>
    <div class="header">
      <h2 style="margin:0; color: #10b981;">WhatsApp Flows</h2>
      <p style="margin:5px 0 0 0; font-size:12px; color:#666;">Trigger Webhook on New Row</p>
    </div>
    
    <div class="form-group">
      <label>Flow Webhook URL</label>
      <input type="text" id="webhookUrl" placeholder="http://YOUR_SERVER/api/flows/webhook/ACCOUNT_ID">
    </div>

    <button onclick="saveSettings()" id="btnSave">Save Webhook</button>

    <hr>

    <button class="btn-secondary" onclick="initialize()" id="btnInit">Initialize Trigger</button>
    <p style="font-size: 11px; color: #666; text-align: center; margin-top: -5px;">Activates the listener for new rows on Sheet1</p>

    <div id="status" class="status"></div>

    <script>
      // Load settings on boot
      google.script.run.withSuccessHandler(function(settings) {
        if(settings) {
          document.getElementById('webhookUrl').value = settings.webhookUrl || '';
        }
      }).getSettings();

      function saveSettings() {
        document.getElementById('btnSave').innerText = 'Saving...';
        const data = {
          webhookUrl: document.getElementById('webhookUrl').value,
          // Reset processed row to allow reprocessing if needed by users
          // Optional, but usually we just want to save the URL.
        };
        
        google.script.run.withSuccessHandler(function() {
          document.getElementById('btnSave').innerText = 'Save Webhook';
          const stat = document.getElementById('status');
          stat.innerText = 'Webhook saved successfully!';
          setTimeout(() => stat.innerText = '', 3000);
        }).saveSettings(data);
      }

      function initialize() {
        document.getElementById('btnInit').innerText = 'Initializing...';
        google.script.run.withSuccessHandler(function(msg) {
          document.getElementById('btnInit').innerText = 'Initialize Trigger';
          const stat = document.getElementById('status');
          stat.innerText = msg;
          setTimeout(() => stat.innerText = '', 5000);
        }).initializeTrigger();
      }
    </script>
  </body>
</html>
